name: Publish AquaDX image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK for regression tests
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Verify profile imports, social data and account management
        run: |
          chmod +x gradlew
          ./gradlew test -PrunTests \
            --tests test.Mai2CustomPortraitSaveTest \
            --tests test.Mai2SocialProfileTest \
            --tests test.Mai2ImportSocialRetentionTest \
            --tests test.ImportTransactionTest \
            --tests test.ImportExportParityTest \
            --tests test.AdminAccountManagementTest \
            --tests test.WaccaDataExportTest --no-daemon

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Set up Node.js for the frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: AquaNet/pnpm-lock.yaml

      - name: Build AquaNet frontend
        working-directory: AquaNet
        env:
          VITE_AQUA_HOST: https://web.maimaidx.top/aqua
          VITE_DATA_HOST: https://asset.maimaidx.top
          VITE_AQUA_CONNECTION: maoninet.jp
          npm_package_version: 1.0.0
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - name: Upload AquaNet frontend
        uses: actions/upload-artifact@v4
        with:
          name: AquaNet-frontend-${{ github.sha }}
          path: AquaNet/dist/
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
