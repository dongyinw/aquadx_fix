name: Publish AquaDX image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK for regression tests
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Verify profile imports, social data and account management
        run: |
          chmod +x gradlew
          ./gradlew test -PrunTests \
            --tests test.Mai2CustomPortraitSaveTest \
            --tests test.Mai2SocialProfileTest \
            --tests test.Mai2ImportSocialRetentionTest \
            --tests test.ImportTransactionTest \
            --tests test.ImportExportParityTest \
            --tests test.AdminAccountManagementTest \
            --tests test.WaccaDataExportTest --no-daemon

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Set up Node.js for the frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: AquaNet/pnpm-lock.yaml

      - name: Build AquaNet frontend
        working-directory: AquaNet
        env:
          VITE_AQUA_HOST: https://web.maimaidx.top/aqua
          VITE_DATA_HOST: https://asset.maimaidx.top
          VITE_AQUA_CONNECTION: maoninet.jp
          npm_package_version: 1.0.0
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export main branch Docker image file
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="${image_base}:sha-${GITHUB_SHA:0:7}"
          docker pull "$image_ref"
          docker tag "$image_ref" "${image_base}:latest"
          mkdir -p release
          archive="AquaDX-image-${GITHUB_SHA}.tar.gz"
          docker save "$image_ref" "${image_base}:latest" | gzip -1 > "release/$archive"
          (cd release && sha256sum "$archive" > "$archive.sha256")

      - name: Upload main branch Docker image file
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: image_file
        uses: actions/upload-artifact@v4
        with:
          name: AquaDX-image-${{ github.sha }}
          path: release/AquaDX-image-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize published artifacts
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_FILE_URL: ${{ steps.image_file.outputs.artifact-url }}
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "Frontend dist: built locally at AquaNet/dist on the build server; not uploaded."
            echo
            echo "Docker image: \`${image_base}@${IMAGE_DIGEST}\`"
            if [ -n "$IMAGE_FILE_URL" ]; then
              echo
              echo "Docker image file: [download]($IMAGE_FILE_URL)"
              echo
              echo "Pull: \`docker pull ${image_base}:latest\`"
              echo
              echo "Offline import: \`gzip -dc AquaDX-image-${GITHUB_SHA}.tar.gz | docker load\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
